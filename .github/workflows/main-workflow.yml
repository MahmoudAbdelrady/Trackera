name: Manual Docker Build, Scan & Push

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy Backend"
        type: boolean
        default: false
      deploy_frontend:
        description: "Deploy Frontend"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend - Build, Scan & Push
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    if: inputs.deploy_backend

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute backend image tags
        id: tags
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          if [[ "${{ github.ref_name }}" == 'main' ]]; then
            echo "tags=${{ secrets.DOCKER_USERNAME }}/trackera-backend:latest,${{ secrets.DOCKER_USERNAME }}/trackera-backend:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "scan_tag=${{ secrets.DOCKER_USERNAME }}/trackera-backend:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKER_USERNAME }}/trackera-backend:dev,${{ secrets.DOCKER_USERNAME }}/trackera-backend:dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "scan_tag=${{ secrets.DOCKER_USERNAME }}/trackera-backend:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build backend image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}

      # Non-blocking scan
      - name: Backend security scan (warnings)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          severity: LOW,MEDIUM
          format: table

      # Blocking scan
      - name: Backend security scan (critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  frontend:
    name: Frontend - Build, Scan & Push
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    if: inputs.deploy_frontend

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute frontend image tags
        id: tags
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          if [[ "${{ github.ref_name }}" == 'main' ]]; then
            echo "tags=${{ secrets.DOCKER_USERNAME }}/trackera-frontend:latest,${{ secrets.DOCKER_USERNAME }}/trackera-frontend:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "scan_tag=${{ secrets.DOCKER_USERNAME }}/trackera-frontend:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKER_USERNAME }}/trackera-frontend:dev,${{ secrets.DOCKER_USERNAME }}/trackera-frontend:dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "scan_tag=${{ secrets.DOCKER_USERNAME }}/trackera-frontend:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TRACKERA_BACKEND_URL=${{ vars.BACKEND_URL }}
            TRACKERA_MAX_FILE_SIZE=${{ vars.MAX_FILE_SIZE }}

      # Non-blocking scan
      - name: Frontend security scan (warnings)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          severity: LOW,MEDIUM
          format: table

      # Blocking scan
      - name: Frontend security scan (critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TRACKERA_BACKEND_URL=${{ vars.BACKEND_URL }}
            TRACKERA_MAX_FILE_SIZE=${{ vars.MAX_FILE_SIZE }}
