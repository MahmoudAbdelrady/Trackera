name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Deploy backend
        type: boolean
        required: false
        default: false
      frontend:
        description: Deploy frontend
        type: boolean
        required: false
        default: false
      nginx:
        description: Deploy nginx
        type: boolean
        required: false
        default: false

run-name: Build and Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }}) - ${{ github.ref_name }}

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      empty: ${{ steps.select.outputs.empty }}
    steps:
      - name: Build matrix
        id: select
        env:
          BACKEND: ${{ inputs.backend }}
          FRONTEND: ${{ inputs.frontend }}
          NGINX: ${{ inputs.nginx }}
        run: |
          images=()

          if [[ "$BACKEND" == "true" ]]; then
            images+=('{"name":"backend","context":"Backend","image":"trackera-backend"}')
          fi
          if [[ "$FRONTEND" == "true" ]]; then
            images+=('{"name":"frontend","context":"Frontend","image":"trackera-frontend"}')
          fi
          if [[ "$NGINX" == "true" ]]; then
            images+=('{"name":"nginx","context":"Nginx","image":"trackera-nginx"}')
          fi

          matrix="$(IFS=,; echo "[${images[*]}]")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "empty=${#images[@]}" >> "$GITHUB_OUTPUT"

          echo "Selected ${#images[@]} image(s): $matrix"

      - name: Fail if nothing selected
        if: steps.select.outputs.empty == '0'
        run: |
          echo "::error::No images selected. Tick at least one of backend / frontend / nginx."
          exit 1

  build-push:
    name: Build ${{ matrix.name }}
    needs: setup
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.pushed.outputs.backend }}
      frontend: ${{ steps.pushed.outputs.frontend }}
      nginx: ${{ steps.pushed.outputs.nginx }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
      TAG_PREFIX: ${{ github.ref_name == 'main' && '' || 'dev-' }}
      FLOATING_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          tags: trackera-${{ matrix.name }}:scan
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}
            TRACKERA_BACKEND_URL=${{ vars.BACKEND_URL }}
            TRACKERA_MAX_FILE_SIZE=${{ vars.MAX_FILE_SIZE }}
          load: true
          push: false
          cache-from: type=gha,scope=deploy-${{ matrix.name }}
          cache-to: type=gha,scope=deploy-${{ matrix.name }},mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: trackera-${{ matrix.name }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          tags: |
            ${{ env.IMAGE }}:${{ env.FLOATING_TAG }}
            ${{ env.IMAGE }}:${{ env.TAG_PREFIX }}${{ github.sha }}
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}
            TRACKERA_BACKEND_URL=${{ vars.BACKEND_URL }}
            TRACKERA_MAX_FILE_SIZE=${{ vars.MAX_FILE_SIZE }}
          push: true
          cache-from: type=gha,scope=deploy-${{ matrix.name }}

      - name: Mark as pushed
        id: pushed
        env:
          NAME: ${{ matrix.name }}
        run: echo "${NAME}=true" >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## ${IMAGE}"
            echo
            echo "Scan passed. Pushed \`${FLOATING_TAG}\` and \`${TAG_PREFIX}${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    if: ${{ always() && (needs.build-push.outputs.backend == 'true' || needs.build-push.outputs.frontend == 'true' || needs.build-push.outputs.nginx == 'true') }}
    env:
      DEPLOY_BACKEND: ${{ needs.build-push.outputs.backend == 'true' }}
      DEPLOY_FRONTEND: ${{ needs.build-push.outputs.frontend == 'true' }}
      DEPLOY_NGINX: ${{ needs.build-push.outputs.nginx == 'true' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      IMAGE_TAG: ${{ github.ref_name == 'main' && '' || 'dev-' }}${{ github.sha }}
    steps:
      - name: Resolve deploy targets
        run: |
          echo "Deploy backend:  $DEPLOY_BACKEND"
          echo "Deploy frontend: $DEPLOY_FRONTEND"
          echo "Deploy nginx:    $DEPLOY_NGINX"
          echo "Image tag:       $IMAGE_TAG"

      - name: Update image version env vars
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg tag "$IMAGE_TAG" \
            --argjson backend "$DEPLOY_BACKEND" \
            --argjson frontend "$DEPLOY_FRONTEND" \
            --argjson nginx "$DEPLOY_NGINX" \
            '{
               data: [
                 (if $backend then {key: "TRACKERA_BACKEND_VERSION", value: $tag} else empty end),
                 (if $frontend then {key: "TRACKERA_FRONTEND_VERSION", value: $tag} else empty end),
                 (if $nginx then {key: "TRACKERA_NGINX_VERSION", value: $tag} else empty end)
               ]
             }')

          echo "Request body: $payload"

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X PATCH "${DEPLOY_URL}/envs/bulk" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to update env vars (HTTP $status)"
            exit 1
          fi

      - name: Start backend application
        if: ${{ env.DEPLOY_BACKEND == 'true' }}
        env:
          APP_ID: ${{ vars.BACKEND_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start backend application (HTTP $status)"
            exit 1
          fi

      - name: Start frontend application
        if: ${{ env.DEPLOY_FRONTEND == 'true' }}
        env:
          APP_ID: ${{ vars.FRONTEND_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start frontend application (HTTP $status)"
            exit 1
          fi

      - name: Start nginx application
        if: ${{ env.DEPLOY_NGINX == 'true' }}
        env:
          APP_ID: ${{ vars.NGINX_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start nginx application (HTTP $status)"
            exit 1
          fi
